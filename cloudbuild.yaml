steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/google-function-app:$COMMIT_SHA
      - .

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/google-function-app:$COMMIT_SHA

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - google-function-app
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/google-function-app:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=512Mi
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID
      # - --set-env-vars=OTEL_SERVICE_NAME=google-function-app  # OTel disabled
      - --project=$PROJECT_ID

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-apps/google-function-app:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
