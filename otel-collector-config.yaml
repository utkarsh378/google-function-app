receivers:
  # LOGS: reads file that entrypoint.sh redirects app stdout+stderr into.
  # No SDK, no Cloud Logging, no Pub/Sub — zero cost, any language.
  filelog:
    # FILE METHOD — active
    include: [/tmp/app.log]
    # NAMED PIPE METHOD — does not work, fileconsumer skips FIFOs silently
    # include: [/tmp/app.pipe]
    start_at: beginning

processors:
  resource/aca:
    attributes:
      - action: insert
        key: kubesense.cluster
        value: us2
      - action: insert
        key: kubesense.env_type
        value: function-app

  resource/add-service-logs:
    attributes:
      - action: upsert
        key: service.name
        value: ${OTEL_SERVICE_NAME}

  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  batch:
    send_batch_size: 10
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

  otlphttp/kubesenselogs:
    endpoint: http://rhythemmigration.kubesense.ai:30055
    tls:
      insecure: true

service:
  pipelines:
    logs/filelog:
      receivers: [filelog]
      processors: [memory_limiter, resource/aca, resource/add-service-logs, batch]
      exporters: [otlphttp/kubesenselogs, debug]
