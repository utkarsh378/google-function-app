receivers:
  # TRACES + METRICS: received from the app via OTLP HTTP
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # LOGS: Cloud Logging sink forwards stdout+stderr to Pub/Sub.
  # Collector subscribes here — no SDK, no code changes, any language.
  # encoding: cloud_logging parses the Cloud Logging LogEntry format.
  googlecloudpubsub:
    project: ${GCP_PROJECT_ID}
    subscription: projects/${GCP_PROJECT_ID}/subscriptions/cloud-run-app-logs-sub
    encoding: cloud_logging

processors:
  resource/aca:
    attributes:
      - action: insert
        key: kubesense.cluster
        value: utest
      - action: insert
        key: kubesense.env_type
        value: function-app

  resource/add-service:
    attributes:
      - action: insert
        key: service.name
        value: ${OTEL_SERVICE_NAME}

  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  batch:
    send_batch_size: 10
    timeout: 1s

exporters:
  debug:
    verbosity: detailed

  # LOGS exporter → KubeSense log ingest
  otlphttp/kubesenselogs:
    endpoint: http://utest.kubesense.ai:30055
    tls:
      insecure: true

  # TRACES exporter → KubeSense trace ingest
  otlphttp/kubesense:
    endpoint: http://utest.kubesense.ai:33443
    tls:
      insecure: true

  # METRICS exporter → KubeSense via Prometheus Remote Write
  prometheusremotewrite:
    endpoint: http://utest.kubesense.ai:30060/api/v1/write
    timeout: 60s
    compression: snappy
    send_metadata: true
    remote_write_queue:
      enabled: true
      num_consumers: 10
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    # LOGS: Pub/Sub (fed by Cloud Logging sink) → KubeSense
    logs/pubsub:
      receivers: [googlecloudpubsub]
      processors: [resource/aca, batch]
      exporters: [otlphttp/kubesenselogs, debug]

    # TRACES: OTLP from app SDK → KubeSense
    traces:
      receivers: [otlp]
      processors: [resource/aca, resource/add-service, batch]
      exporters: [otlphttp/kubesense, debug]

    # METRICS: OTLP from app SDK → KubeSense
    metrics:
      receivers: [otlp]
      processors: [resource/aca, batch]
      exporters: [debug, prometheusremotewrite]
